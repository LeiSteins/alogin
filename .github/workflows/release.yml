name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use a semantic version such as v0.1.8" >&2
            exit 1
          fi
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag version ($tag_version) does not match app versionName ($app_version)" >&2
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Run unit tests and build release APK
        env:
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew test assembleRelease --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          release_dir="$RUNNER_TEMP/release"
          apk_name="alogin-v${version}.apk"
          mkdir -p "$release_dir"
          install -m 0644 app/build/outputs/apk/release/app-release.apk "$release_dir/$apk_name"
          (
            cd "$release_dir"
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

      - name: Remove release keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f release.keystore

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  deploy-server:
    name: Upload APK to update server
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-apk-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release

      - name: Prepare deployment SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"

          deploy_port="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != "/" && "$DEPLOY_PATH" != *".."* ]]
          [[ "$deploy_port" =~ ^[0-9]+$ ]]
          (( deploy_port >= 1 && deploy_port <= 65535 ))

          deploy_ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$deploy_ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$deploy_ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_ssh_dir/known_hosts"
          chmod 600 "$deploy_ssh_dir/id_ed25519" "$deploy_ssh_dir/known_hosts"
          {
            echo "DEPLOY_PORT=$deploy_port"
            echo "DEPLOY_SSH_DIR=$deploy_ssh_dir"
          } >> "$GITHUB_ENV"

      - name: Upload release files
        shell: bash
        run: |
          set -euo pipefail

          remote_target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="${DEPLOY_PATH%/}"
          ssh_options=(
            -i "$DEPLOY_SSH_DIR/id_ed25519"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$DEPLOY_SSH_DIR/known_hosts"
          )

          ssh "${ssh_options[@]}" "$remote_target" \
            "test -d '$remote_dir' && test -w '$remote_dir'"
          rsync -az --chmod=F644 \
            -e "ssh -i $DEPLOY_SSH_DIR/id_ed25519 -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$DEPLOY_SSH_DIR/known_hosts" \
            release/alogin-v*.apk release/alogin-v*.apk.sha256 \
            "$remote_target:$remote_dir/"
